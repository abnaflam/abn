<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>beIN MAX</title>
<style>
body{background:#0f172a;color:#fff;font-family:Arial}
.card{background:#1e293b;padding:10px;margin:10px;border-radius:8px}
button{padding:8px;width:100%;background:#ff9800;border:0}
</style>
</head>
<body>

<h3>beIN MAX</h3>
<div id="out">جاري التحميل...</div>

<script>
fetch("https://orange-resonance-21fe.alysjc7.workers.dev")
.then(r => r.json())
.then(j => {
  let h = "";
  j.data.forEach(c=>{
    JSON.parse(c.servers).forEach(s=>{
      h += `
      <div class="card">
        ${c.title}<br>
        ${s.name}<br>
        <button onclick="window.open('https://cast-x.com/player/?stream=${encodeURIComponent(s.url)}')">
        تشغيل
        </button>
      </div>`;
    });
  });
  document.getElementById("out").innerHTML = h;
})
.catch(e=>{
  document.getElementById("out").innerText = "فشل الجلب";
});
</script>

</body>
</html>
