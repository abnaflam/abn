<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Streaming Player</title>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; display: flex; justify-content: center; align-items: center;
        }
        video {
            width: 100%;
            height: 100%;
            max-width: 100%;
            background-color: #000;
        }
    </style>
</head>
<body>

    <video id="video" controls autoplay playsinline poster="https://anym3u8player.com/live.gif"></video>

    <script>
        var video = document.getElementById('video');
        // الرابط الخاص بك
        var videoSrc = 'https://akotv.cc/eighty_eight.php?stream=bs-1_low-1';

        if (Hls.isSupported()) {
            var hls = new Hls({
                // إعدادات لفك تشفير الروابط المعقدة
                enableWorker: true,
                lowLatencyMode: true,
                backBufferLength: 90
            });
            hls.loadSource(videoSrc);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play();
            });
            
            // معالجة الأخطاء وإعادة المحاولة تلقائياً
            hls.on(Hls.Events.ERROR, function (event, data) {
                if (data.fatal) {
                    switch (data.type) {
                        case Hls.ErrorTypes.NETWORK_ERROR:
                            console.log("خطأ في الشبكة، محاولة إعادة الاتصال...");
                            hls.startLoad();
                            break;
                        case Hls.ErrorTypes.MEDIA_ERROR:
                            console.log("خطأ في الميديا، محاولة الإصلاح...");
                            hls.recoverMediaError();
                            break;
                        default:
                            hls.destroy();
                            break;
                    }
                }
            });
        }
        // لدعم متصفح Safari على iPhone
        else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = videoSrc;
            video.addEventListener('loadedmetadata', function() {
                video.play();
            });
        }
    </script>
</body>
</html>
